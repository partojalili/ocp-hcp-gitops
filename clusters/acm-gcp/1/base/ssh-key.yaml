apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: 1-ssh-key
  namespace: 1
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hcp-secrets-store
    kind: ClusterSecretStore
  target:
    name: 1-ssh-private-key
    creationPolicy: Owner
  data:
    - secretKey: ssh-privatekey
      remoteRef:
        key: ocp-ssh-key
        property: ssh-privatekey
