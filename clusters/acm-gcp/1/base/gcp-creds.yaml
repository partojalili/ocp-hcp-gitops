apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: 1-gcp-creds
  namespace: 1
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hcp-secrets-store
    kind: ClusterSecretStore
  target:
    name: 1-gcp-creds
    creationPolicy: Owner
  data:
    - secretKey: osServiceAccount.json
      remoteRef:
        key: gcp-service-account
        property: service-account.json
