apiVersion: v1
kind: Secret
metadata:
  name: gcp-cluster1-install-config
  namespace: gcp-cluster1
type: Opaque
stringData:
  install-config.yaml: |
    apiVersion: v1
    baseDomain: dqp8z.gcp.redhatworkshops.io
    featureSet: TechPreviewNoUpgrade
    metadata:
      name: gcp-cluster1
    platform:
      gcp:
        projectID: openenv-dqp8z
        region: us-east1
        userProvisionedDNS: Enabled
    controlPlane:
      name: master
      platform:
        gcp:
          type: n2-standard-4
      replicas: 3
    compute:
    - name: worker
      platform:
        gcp:
          type: n2-standard-4
      replicas: 3
    networking:
      networkType: OVNKubernetes
      clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
      serviceNetwork:
      - 172.30.0.0/16
      machineNetwork:
      - cidr: 10.0.0.0/16
    pullSecret: ""
    sshKey: ""
    publish: External
