apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: ${{ values.name }}-listener
  namespace: ${{ values.namespace }}
  labels:
    app: ${{ values.name }}
spec:
  serviceAccountName: pipeline
  triggers:
    - name: github-push
      interceptors:
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: token
            - name: eventTypes
              value:
                - push
      bindings:
        - ref: ${{ values.name }}-triggerbinding
      template:
        ref: ${{ values.name }}-triggertemplate

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: ${{ values.name }}-triggerbinding
  namespace: ${{ values.namespace }}
  labels:
    app: ${{ values.name }}
spec:
  params:
    - name: git-revision
      value: $(body.head_commit.id)
    - name: git-url
      value: $(body.repository.url)

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: ${{ values.name }}-triggertemplate
  namespace: ${{ values.namespace }}
  labels:
    app: ${{ values.name }}
spec:
  params:
    - name: git-revision
    - name: git-url
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: ${{ values.name }}-build-deploy-
        namespace: ${{ values.namespace }}
      spec:
        pipelineRef:
          name: ${{ values.name }}-build-deploy
        params:
          - name: GIT_URL
            value: $(tt.params.git-url)
          - name: GIT_REVISION
            value: $(tt.params.git-revision)
          - name: IMAGE_NAME
            value: ${{ values.imageRegistry }}/${{ values.imageRepository }}
          - name: IMAGE_TAG
            value: $(tt.params.git-revision)
          - name: APP_PATH
            value: apps/nodejs
          - name: DEPLOYMENT_NAMESPACE
            value: ${{ values.namespace }}
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 1Gi
          - name: dockerconfig
            secret:
              secretName: registry-credentials
