apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ${{ values.name }}-build-deploy
  namespace: ${{ values.namespace }}
  labels:
    app: ${{ values.name }}
spec:
  params:
    - name: GIT_URL
      type: string
      description: Git repository URL
      default: https://github.com/partojalili/ocp-hcp-gitops
    - name: GIT_REVISION
      type: string
      description: Git revision to build
      default: main
    - name: IMAGE_NAME
      type: string
      description: Container image name
      default: ${{ values.imageRegistry }}/${{ values.imageRepository }}
    - name: IMAGE_TAG
      type: string
      description: Container image tag
      default: latest
    - name: APP_PATH
      type: string
      description: Path to application source
      default: ${{ values.sourceFolder }}
    - name: DEPLOYMENT_NAMESPACE
      type: string
      description: Namespace for deployment
      default: ${{ values.namespace }}

  workspaces:
    - name: source
      description: Workspace for source code
    - name: dockerconfig
      description: Docker config for registry authentication

  tasks:
    - name: git-clone
      taskRef:
        name: git-clone
        kind: ClusterTask
      params:
        - name: url
          value: $(params.GIT_URL)
        - name: revision
          value: $(params.GIT_REVISION)
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: source

    - name: build-image
      taskRef:
        name: buildah
        kind: ClusterTask
      runAfter:
        - git-clone
      params:
        - name: IMAGE
          value: $(params.IMAGE_NAME):$(params.IMAGE_TAG)
        - name: DOCKERFILE
          value: ./$(params.APP_PATH)/Dockerfile
        - name: CONTEXT
          value: ./$(params.APP_PATH)
        - name: TLSVERIFY
          value: "false"
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig

    - name: update-deployment
      taskRef:
        name: openshift-client
        kind: ClusterTask
      runAfter:
        - build-image
      params:
        - name: SCRIPT
          value: |
            oc set image deployment/${{ values.name }} \
              ${{ values.name }}=$(params.IMAGE_NAME):$(params.IMAGE_TAG) \
              -n $(params.DEPLOYMENT_NAMESPACE)
            oc rollout status deployment/${{ values.name }} -n $(params.DEPLOYMENT_NAMESPACE)

    - name: verify-deployment
      taskRef:
        name: openshift-client
        kind: ClusterTask
      runAfter:
        - update-deployment
      params:
        - name: SCRIPT
          value: |
            oc get deployment ${{ values.name }} -n $(params.DEPLOYMENT_NAMESPACE)
            oc get pods -l app=${{ values.name }} -n $(params.DEPLOYMENT_NAMESPACE)
            echo "Deployment successful!"
