apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ${{ values.name }}
  namespace: openshift-gitops
  labels:
    app: ${{ values.name }}
spec:
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: ${{ values.name }}-placement
        requeueAfterSeconds: 180
  template:
    metadata:
      name: ${{ values.name }}
      labels:
        app: ${{ values.name }}
    spec:
      project: default
      source:
        repoURL: https://github.com/partojalili/ocp-hcp-gitops.git
        targetRevision: main
        path: deployments/${{ values.name }}
      destination:
        name: '{{`{{name}}`}}'
        namespace: ${{ values.namespace }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: ${{ values.name }}-placement
  namespace: openshift-gitops
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            name: ${{ values.targetCluster }}
