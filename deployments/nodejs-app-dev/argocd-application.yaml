apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nodejs-app-dev
  namespace: openshift-gitops
  labels:
    app: nodejs-app-dev
spec:
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: nodejs-app-dev-placement
        requeueAfterSeconds: 180
  template:
    metadata:
      name: nodejs-app-dev
      labels:
        app: nodejs-app-dev
    spec:
      project: default
      source:
        repoURL: https://github.com/partojalili/ocp-hcp-gitops.git
        targetRevision: main
        path: deployments/nodejs-app-dev
      destination:
        name: '{{`{{name}}`}}'
        namespace: nodejs-app
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: nodejs-app-dev-placement
  namespace: openshift-gitops
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            name: hcp-cluster
