apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: nodejs-app1-listener
  namespace: nodejs-app1
  labels:
    app: nodejs-app1
spec:
  serviceAccountName: pipeline
  triggers:
    - name: github-push
      interceptors:
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: token
            - name: eventTypes
              value:
                - push
      bindings:
        - ref: nodejs-app1-triggerbinding
      template:
        ref: nodejs-app1-triggertemplate

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: nodejs-app1-triggerbinding
  namespace: nodejs-app1
  labels:
    app: nodejs-app1
spec:
  params:
    - name: git-revision
      value: $(body.head_commit.id)
    - name: git-url
      value: $(body.repository.url)

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: nodejs-app1-triggertemplate
  namespace: nodejs-app1
  labels:
    app: nodejs-app1
spec:
  params:
    - name: git-revision
    - name: git-url
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: nodejs-app1-build-deploy-
        namespace: nodejs-app1
      spec:
        pipelineRef:
          name: nodejs-app1-build-deploy
        params:
          - name: GIT_URL
            value: $(tt.params.git-url)
          - name: GIT_REVISION
            value: $(tt.params.git-revision)
          - name: IMAGE_NAME
            value: quay.io/partojalili/nodejs-app1
          - name: IMAGE_TAG
            value: $(tt.params.git-revision)
          - name: APP_PATH
            value: apps/nodejs
          - name: DEPLOYMENT_NAMESPACE
            value: nodejs-app1
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 1Gi
          - name: dockerconfig
            secret:
              secretName: registry-credentials
