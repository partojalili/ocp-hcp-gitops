apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: nodejs-app7-build-deploy-
  namespace: nodejs-app7
  labels:
    app: nodejs-app7
    tekton.dev/pipeline: nodejs-app7-build-deploy
spec:
  pipelineRef:
    name: nodejs-app7-build-deploy
  params:
    - name: GIT_URL
      value: https://github.com/partojalili/ocp-hcp-gitops
    - name: GIT_REVISION
      value: main
    - name: IMAGE_NAME
      value: quay.io/pjalili/nodejs-app
    - name: IMAGE_TAG
      value: $(context.pipelineRun.name)
    - name: APP_PATH
      value: apps/nodejs
    - name: DEPLOYMENT_NAMESPACE
      value: nodejs-app7
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    - name: dockerconfig
      secret:
        secretName: registry-credentials
